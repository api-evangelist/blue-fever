aid: blue-fever
name: Blue Fever
description: >-
  Blue Fever is a social and mental-health app for young people that pairs a
  judgment-free peer community with "Blue," an AI emotional-support companion,
  under the tagline "A place to feel seen, not be seen." Users share thoughts,
  moods, and creative expression and receive support from both community members
  and the AI companion, alongside curated wellness resources and crisis support.
  The app is available on iOS and Android, has been featured as an Apple App of
  the Day, and carries a 4.6 App Store rating. The company was surfaced as a
  Techstars portfolio company and added to the API Evangelist network; it is a
  consumer application with no public developer API, SDK, or documentation
  surface at this time.
